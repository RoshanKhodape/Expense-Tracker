<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Monthly Expense Chart</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            /* dark navy black */
            color: #e5e7eb;
            margin: 0;
            padding: 0;
        }


        canvas {
            max-width: 700px;
            margin: 25px auto;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2 style="margin-bottom:5px;">📊 Monthly Expense Chart</h2>
    <p style="color:#666; margin-top:0;">
        Visual summary of your spending
    </p>

    <canvas id="expenseChart"></canvas>

    <script>
        (function () {
            const chartMonths = {{ months | tojson | safe
        }};
        const chartTotals = {{ totals | tojson | safe }};

        if (chartMonths.length === 0) {
            document.body.insertAdjacentHTML(
                "beforeend",
                "<p style='color:#888;'>No expense data found</p>"
            );
            return;
        }

        const ctx = document
            .getElementById("expenseChart")
            .getContext("2d");

        new Chart(ctx, {
            type: "bar",
            data: {
                labels: chartMonths,
                datasets: [{
                    label: "Total Expense (₹)",
                    data: chartTotals,
                    backgroundColor: "rgba(75, 192, 192, 0.6)",
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        }) ();
    </script>

    <br>
    <a href="/">⬅ Back to Dashboard</a>

</body>

</html>
